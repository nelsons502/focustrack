apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: team-focustrack
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: ES_URL
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: es-url
            - name: ES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: es-api-key
            - name: DASH0_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: dash0-credentials
                  key: dash0-endpoint
                  optional: true
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dash0-credentials
                  key: dash0-token
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
