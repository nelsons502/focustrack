name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect app
        id: app
        run: echo "present=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.app.outputs.present == 'true'
        run: npm ci
      - if: steps.app.outputs.present == 'true'
        run: npm run typecheck --if-present
      - if: steps.app.outputs.present == 'true'
        run: npm run lint --if-present
      - if: steps.app.outputs.present == 'true'
        run: npm test --if-present
      - if: steps.app.outputs.present == 'true'
        run: npm run build
