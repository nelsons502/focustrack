apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-focustrack
  namespace: team-focustrack
spec:
  project: team-focustrack
  source:
    repoURL: https://github.com/nelsons502/focustrack.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: team-focustrack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
